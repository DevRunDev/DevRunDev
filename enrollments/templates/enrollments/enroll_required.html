{% extends 'courses/base.html' %}

{% block title %}수강 신청 필요 - DevRunDev{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row">
    <div class="col-md-8 offset-md-2">
      <div class="card shadow-sm">
        <div class="card-header bg-warning text-dark">
          <h3 class="mb-0"><i class="bi bi-exclamation-triangle me-2"></i> 수강 신청이 필요합니다!</h3>
        </div>
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-lock-fill text-warning" style="font-size: 5rem;"></i>
          </div>

          <h4 class="text-center mb-3">이 강의를 수강하려면 먼저 수강 신청을 해야 합니다.</h4>
          <p class="text-center mb-4">강의 상세 페이지에서 수강 신청 버튼을 클릭하여 신청을 완료하세요.</p>

          <div class="d-grid col-md-6 mx-auto">
            <a href="{% url 'courses:course_detail' course.id %}" class="btn btn-primary">
              <i class="bi bi-book me-2"></i> 강의 상세 페이지로 이동
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
