<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>섹션 수정</title>
</head>
<body>
    <h1>✏️ 섹션 수정</h1>

    <form method="post">
        {% csrf_token %}
        <label for="id_title">섹션 제목</label>
        <input type="text" name="title" id="id_title" value="{{ form.title.value }}" required>

        <button type="submit">수정 완료</button>
    </form>

    <a href="{% url 'courses:course_detail' pk=section.course.id %}">🔙 강의 상세 페이지로 돌아가기</a>
</body>
</html>
